<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3efe6">
<title>Ручки для дверей</title>
<style>
  :root {
    --bg: #f3efe6;
    --ink: #1d1a16;
    --muted: #6f675c;
    --card: #fffdf8;
    --line: #e4dccf;
    --ok: #1c6b45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 36rem; margin: 0 auto; padding: 1.6rem 1rem 5rem; }
  h1 { font-size: 1.7rem; font-weight: 650; margin: 0 0 .35rem; letter-spacing: -.02em; }
  .hint { color: var(--muted); margin: 0 0 1.2rem; }
  h2 { font-size: 1rem; font-weight: 650; margin: 0 0 .7rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: .95rem 1rem 1rem;
    margin: 0 0 .7rem;
  }
  .card h3 { margin: 0; font-size: 1.08rem; }
  .note { color: var(--muted); margin: .35rem 0 0; font-size: .95rem; }
  button.copy {
    display: block;
    width: 100%;
    margin-top: .75rem;
    border: 0;
    border-radius: 10px;
    background: var(--ok);
    color: #fff;
    font: inherit;
    font-weight: 650;
    padding: .75rem .9rem;
    cursor: pointer;
  }
  button.copy.done { background: #143d2c; }
  .empty { color: var(--muted); }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 1.2rem;
    transform: translateX(-50%) translateY(1rem);
    background: #1d1a16;
    color: #fff;
    padding: .7rem 1rem;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: .2s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main>
  <h1>Ручки для дверей</h1>
  <p class="hint">Проверяем ручки от запертых дверей.</p>
  <h2>Можно пользоваться</h2>
  <div id="list"><p class="empty">Загрузка…</p></div>
</main>
<div id="toast" role="status"></div>
<script>
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function parseWorking(text) {
  const blocks = [];
  let cur = null;
  for (const line of text.replace(/\r\n/g, "\n").split("\n")) {
    const m = line.match(/^# (\d+)\. (.+)$/);
    if (m) {
      if (cur) blocks.push(cur);
      cur = { name: m[2].trim(), note: "", body: [] };
      continue;
    }
    if (cur && line.startsWith("# = ")) {
      cur.note = line.slice(4).trim();
      continue;
    }
    if (cur) cur.body.push(line);
  }
  if (cur) blocks.push(cur);
  return blocks
    .map((b) => ({ name: b.name, note: b.note || "", config: b.body.join("\n").trim() }))
    .filter((b) => b.config);
}

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  button.textContent = "Скопировано";
  button.classList.add("done");
  toast("Скопировано.");
  setTimeout(() => {
    button.textContent = "Скопировать конфигурацию";
    button.classList.remove("done");
  }, 1600);
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("button.copy");
  if (!button) return;
  copyText(decodeURIComponent(button.dataset.config), button);
});

async function load() {
  const res = await fetch("working-keys.txt?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(String(res.status));
  const items = parseWorking(await res.text());
  $("list").innerHTML = items.length
    ? items.map((item) => `<article class="card"><h3>${esc(item.name)}</h3>${item.note ? `<p class="note">${esc(item.note)}</p>` : ""}<button class="copy" type="button" data-config="${encodeURIComponent(item.config)}">Скопировать конфигурацию</button></article>`).join("")
    : `<p class="empty">Пока пусто.</p>`;
}

load().catch(() => {
  $("list").innerHTML = `<p class="empty">Не удалось загрузить список.</p>`;
});
</script>
</body>
</html>
